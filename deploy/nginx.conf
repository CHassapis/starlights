server {
    listen 80;
    root /usr/share/nginx/html;

    # resolve the API through Docker's DNS per request, so nginx starts even when the API
    # container is not up yet (e.g. after a reboot) instead of exiting with "host not found"
    resolver 127.0.0.11 valid=10s;
    set $api http://starlights-api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # client-side routes (react-router)
    location / {
        try_files $uri /index.html;
    }
}
