# Two doors into the same site: port 80 for the LAN and Tailscale (as before), and port 8080 for the public
# address (Tailscale Funnel forwards to it; the compose file publishes it on the server's localhost only), where
# everyone first gives the site password.
map $server_port $site_gate {
    8080    "Starlights";
    default off;
}

# who is asking: on the public door every request comes from Tailscale, which passes the visitor's address on
# (the last X-Forwarded-For entry is the one Tailscale added); on the LAN door it is the connection's
map $http_x_forwarded_for $forwarded_last {
    "~([^,\s]+)\s*$" $1;
    default "";
}
map "$server_port|$forwarded_last" $visitor {
    "~^8080\|(.+)$" $1;
    default $binary_remote_addr;
}
map "$server_port|$forwarded_last" $public_visitor {
    "~^8080\|(.+)$" $1;
    default "";
}
# password guesses: a few tries a minute per visitor on the unlock endpoints; on the public door also an overall
# pace per visitor (a page load is a few dozen requests), which slows guessing the site password
limit_req_zone $visitor zone=unlock:1m rate=6r/m;
limit_req_zone $public_visitor zone=public:5m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    listen 8080;
    server_tokens off;

    auth_basic $site_gate;
    auth_basic_user_file /etc/nginx/starlights.htpasswd;
    limit_req zone=public burst=200 nodelay;

    # no sniffing content types, no framing by other sites, no referrer to other sites; HTTPS only once a browser
    # has come over HTTPS (the Cloudflare address; over plain http on the LAN browsers ignore it)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # portraits are shrunk in the browser, but homebrew files and campaign documents can be a few MB
    client_max_body_size 8m;
    root /usr/share/nginx/html;

    # compress text, JSON (the item catalog is ~1 MB of JSON) and scripts; proxied API responses too
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # resolve the API through Docker's DNS per request, so nginx starts even when the API
    # container is not up yet (e.g. after a reboot) instead of exiting with "host not found"
    resolver 127.0.0.11 valid=10s;
    set $api http://starlights-api:8080;

    location ~ ^/api/((admin|players)/unlock|campaigns/[0-9a-fA-F-]+/unlock)$ {
        limit_req zone=unlock burst=4 nodelay;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api;
        proxy_read_timeout 600s; # a full Aurora import runs inside one request
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # client-side routes (react-router)
    location / {
        try_files $uri /index.html;
    }
}
